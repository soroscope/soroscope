[workspace]

[package]
name = "soroscope-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "In-process Soroban execution for @soroscope/dev: runs a contract inside soroban-env-host, with no network."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-env-host = { version = "=30.0.0", features = ["recording_mode"] }
soroban-simulation = "30"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
stellar-strkey = "0.0.13"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
