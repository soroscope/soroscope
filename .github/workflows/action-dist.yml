# ─────────────────────────────────────────────────────────────────────────────
# Purpose:  The GitHub Action ships as one committed bundle
#           (packages/ci/action/index.cjs) so it runs without npm install.
#           This job rebuilds it from source and fails if the committed copy
#           is stale, which would mean users run different code than reviewed.
# Triggers: pull_request / push touching the Action, core, invoke or ci sources
# ─────────────────────────────────────────────────────────────────────────────

name: Action bundle

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ci/**'
      - 'packages/core/src/**'
      - 'packages/invoke/src/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/ci/**'
      - 'packages/core/src/**'
      - 'packages/invoke/src/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  bundle:
    name: Committed bundle matches source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm exec turbo run build --filter=@soroscope/ci^...

      - name: Rebuild the bundle
        run: pnpm --filter @soroscope/ci bundle:action

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --exit-code -- packages/ci/action; then
            echo "::error::packages/ci/action/index.cjs is out of date. Run 'pnpm --filter @soroscope/ci bundle:action' and commit the result."
            exit 1
          fi
