# ─────────────────────────────────────────────────────────────────────────────
# Purpose:  Core quality gate for every package: build, type check, lint (which
#           also bans mocks in tests), fixture provenance, and unit tests.
#           Live-network tests are in integration.yml.
# Triggers: push to main/develop, pull_request targeting main
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - '!packages/demo/**'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/demo/**'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, type check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          # @stellar/stellar-sdk requires Node 22.12 or newer.
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and type check
        run: pnpm exec turbo run build typecheck --filter='!@soroscope/demo'

      - name: Lint (includes the no-mocks rule for tests)
        run: pnpm lint

      - name: Check fixtures carry provenance
        run: pnpm check:fixtures

      - name: Unit tests
        run: pnpm test

  engine:
    name: In-process engine (Rust) and parity with live testnet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo registry and engine build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/dev/engine/target
          key: ${{ runner.os }}-engine-${{ hashFiles('packages/dev/engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-engine-

      - name: Build the engine
        # wasm32v1-none is for the watch-loop test, which compiles a real contract.
        run: |
          rustup update stable
          rustup target add wasm32v1-none
          pnpm --filter @soroscope/dev build:engine

      - name: Build packages the engine tests import
        run: pnpm exec turbo run build --filter=@soroscope/dev... --filter=@soroscope/testing...

      - name: Engine, session and watch-loop tests (recorded live parity; no network needed)
        run: pnpm --filter @soroscope/dev test:engine

      - name: Fork tests (the engine against recorded live mainnet state; no network needed)
        run: pnpm --filter @soroscope/testing test:engine
