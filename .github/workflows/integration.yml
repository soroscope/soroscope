# ─────────────────────────────────────────────────────────────────────────────
# Purpose:  Runs every package's integration tests against the LIVE Stellar
#           testnet: real RPC providers, a deployed fixture contract, real
#           transactions. Public endpoints are shared infrastructure and
#           occasionally flaky, so this is not a required check; it runs on
#           pull requests that touch code, nightly, and on demand.
# Triggers: pull_request, nightly schedule, manual
# ─────────────────────────────────────────────────────────────────────────────

name: Integration (live testnet)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - '!packages/demo/**'
      - '.github/workflows/integration.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo run build --filter='!@soroscope/demo'

      - name: Integration tests
        run: pnpm test:integration
