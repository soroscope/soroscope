[workspace]

[package]
name = "soroscope-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "In-process Soroban execution for @soroscope/dev: runs a contract inside soroban-env-host, with no network."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# One host per protocol the engine can emulate, renamed so both link into one
# library. A host only runs the protocol it was released for; see src/lib.rs.
# Add the next protocol here, as host31/sim31, when the network moves.
host29 = { package = "soroban-env-host", version = "=29.0.2", features = ["recording_mode"] }
sim29 = { package = "soroban-simulation", version = "=29.0.2" }
host30 = { package = "soroban-env-host", version = "=30.0.0", features = ["recording_mode"] }
sim30 = { package = "soroban-simulation", version = "=30.0.0" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
base64 = "0.22"
sha2 = "0.11"
serde_json = "1"
stellar-strkey = "0.0.13"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
